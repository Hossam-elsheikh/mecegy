name: Discord Notifications

on:
  push:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{\"content\":\"🚀 ${{ github.actor }} pushed to ${{ github.ref_name }} in ${{ github.repository }}\"}" \
          "${{ secrets.DISCORD_WEBHOOK }}"